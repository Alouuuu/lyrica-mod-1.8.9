name: Release 1.8.9

# Publishes only the Forge 1.8.9 port (legacy-1.8.9/). Tag a commit on the port branch with
# v<version>, where <version> is legacy-1.8.9/gradle.properties' `version` (e.g. v0.9.4-1.8.9).
on:
  push:
    tags: ["v*-1.8.9"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
        working-directory: legacy-1.8.9
    steps:
      - uses: actions/checkout@v5

      # Java 8 runs Minecraft 1.8.9, 21 compiles the upstream Java and 17 runs Gradle 8.8 and Kotlin
      # (its cacerts are also bundled for LegacyTls). 17 goes last so it becomes JAVA_HOME.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag against the mod version
        id: version
        run: |
          $tagVersion = "${{ github.ref_name }}".Substring(1)
          $line = Select-String -Path gradle.properties -Pattern '^\s*version\s*=\s*(\S+)\s*$' | Select-Object -First 1
          if (!$line) { throw "No version in legacy-1.8.9/gradle.properties" }
          $modVersion = $line.Matches[0].Groups[1].Value
          if ($tagVersion -ne $modVersion) {
            throw "Tag ${{ github.ref_name }} does not match gradle.properties version $modVersion"
          }
          "version=$modVersion" >> $env:GITHUB_OUTPUT
          $notes = "docs/releases/$modVersion.md"
          if (Test-Path -LiteralPath $notes) { "notes=legacy-1.8.9/$notes" >> $env:GITHUB_OUTPUT }

      - name: Build
        run: |
          Write-Host "JDK 8:  $env:JAVA_HOME_8_X64"
          Write-Host "JDK 17: $env:JAVA_HOME_17_X64"
          Write-Host "JDK 21: $env:JAVA_HOME_21_X64"
          .\gradlew.bat build --no-daemon `
            "-Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64" `
            "-Porg.gradle.java.installations.auto-download=false"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the jar
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $jar = "build/libs/lyrica-$version.jar"
          if (!(Test-Path -LiteralPath $jar)) { throw "Missing $jar" }

          # The bundled bridge must be the published one (its .sha256 sits next to it).
          $bridge = "src/main/resources/relaylyrics/native/windows-x86_64/relaylyrics-media-bridge.exe"
          $expected = (Get-Content -LiteralPath "$bridge.sha256" -Raw).Trim().Split()[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $bridge -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Bridge checksum mismatch: $actual, expected $expected" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $jar).Path)
          try {
            if (!$archive.GetEntry("relaylyrics/native/windows-x86_64/relaylyrics-media-bridge.exe")) {
              throw "The Windows bridge is missing from $jar"
            }

            $info = $archive.GetEntry("mcmod.info")
            if (!$info) { throw "mcmod.info is missing from $jar" }
            $reader = New-Object IO.StreamReader($info.Open())
            try { $mcmod = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($mcmod -notmatch [regex]::Escape("`"version`": `"$version`"")) {
              throw "mcmod.info does not carry version $version"
            }

            # Minecraft 1.8.9 runs on Java 8: every class must be bytecode major 52 or lower.
            $tooNew = @()
            foreach ($entry in $archive.Entries) {
              if (!$entry.FullName.EndsWith(".class")) { continue }
              $stream = $entry.Open()
              try {
                $header = New-Object byte[] 8
                $read = 0
                while ($read -lt 8) {
                  $n = $stream.Read($header, $read, 8 - $read)
                  if ($n -le 0) { break }
                  $read += $n
                }
              } finally { $stream.Dispose() }
              if ($read -lt 8) { continue }
              $major = $header[6] * 256 + $header[7]
              if ($major -gt 52) { $tooNew += "$($entry.FullName) (major $major)" }
            }
            if ($tooNew.Count -gt 0) {
              throw "Classes newer than Java 8:`n" + ($tooNew | Select-Object -First 20 | Out-String)
            }
          } finally {
            $archive.Dispose()
          }
          Write-Host "Verified $jar"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: Lyrica ${{ steps.version.outputs.version }} (Minecraft 1.8.9)
          body_path: ${{ steps.version.outputs.notes }}
          body: ${{ steps.version.outputs.notes == '' && format('Lyrica {0} for Minecraft 1.8.9 (Forge).', steps.version.outputs.version) || '' }}
          fail_on_unmatched_files: true
          files: legacy-1.8.9/build/libs/lyrica-${{ steps.version.outputs.version }}.jar
